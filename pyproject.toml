[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blacklang"
version = "0.2.0"
description = "BlackLang —— 面向 AI 的下一代编程语言。让 AI 快速、安全地做到任何想做的项目。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
# 进程内 LLVM JIT（--jit）。AOT→LLVM(--llvm) 只需系统 clang，无需此依赖。
llvm = ["llvmlite>=0.40"]

[project.scripts]
blacklang = "blacklang.cli:main"

[tool.setuptools.packages.find]
where = ["src"]